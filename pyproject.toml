[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docheal"
version = "0.1.0"
description = "Keep technical documentation synchronized with Python code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DocHeal contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "openai>=1.40,<3",
  "chromadb>=0.5,<2",
  "PyGithub>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
docheal = "docheal.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docheal"]

[tool.hatch.build.targets.wheel.force-include]
"demo" = "docheal/demo_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
